[project]
name = "heat-nowcast"
version = "0.1.0"
description = "GB domestic heat demand nowcast from LSOA building stock"
requires-python = ">=3.11"
authors = [{ name = "Chun Sang Au Yong", email = "auyongchunsang@gmail.com" }]

dependencies = [
    # dataframes
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    # modelling
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "numpy>=1.26",
    # geospatial / stock aggregation
    "geopandas>=1.0",
    "shapely>=2.0",
    "xarray>=2024.6",
    "netcdf4>=1.6",
    # data access
    "httpx>=0.27",
    "requests>=2.32",
    "cdsapi>=0.7",
    "python-dotenv>=1.0",
    # plotting
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbstripout>=0.7",
    "pandas-stubs",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heat_nowcast"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PD",        # pandas-vet
    "NPY",       # numpy
    "RUF",
    "ANN",       # flake8-annotations -- typed signatures are mandatory
    "D",         # pydocstyle -- loaders must document source URL + vintage
    "PTH",       # use pathlib
    "DTZ",       # flake8-datetimez -- naive datetimes are a point-in-time hazard
]
ignore = [
    "D100",   # module docstring: covered by package __init__ docstrings
    "D104",
    "D203", "D213",  # conflicting pydocstyle rules
    "E501",   # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "ARG"]
"notebooks/**" = ["D", "ANN", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# ---------------------------------------------------------------------------
# mypy -- typed function signatures are required (CLAUDE.md section 7)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "geopandas.*",
    "statsmodels.*",
    "cdsapi.*",
    "seaborn.*",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: hits the network or takes >10s",
    "pointintime: asserts a feature cannot see the future -- never skip these",
]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["src"]
branch = true
